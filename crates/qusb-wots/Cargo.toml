[package]
name = "qusb-wots"
description = "Winternitz one-time signatures for qUSB (no_std verify, shared with the qvault program)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["dep:sha2", "dep:zeroize"]

[dependencies]
sha2 = { version = "0.10", optional = true }
zeroize = { version = "1", optional = true, features = ["derive"] }
