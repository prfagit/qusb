name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks: # fmt, clippy, tests, program build and deployed-hash check
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  out: qusb-linux-x64,        cross: false, musl: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, out: qusb-linux-arm64,      cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,        out: qusb-macos-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,       out: qusb-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     out: qusb-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p qusb-cli --bin qusb --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p qusb-cli --bin qusb --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: |
          mkdir out
          ext=""; case "${{ matrix.target }}" in *windows*) ext=".exe";; esac
          cp "target/${{ matrix.target }}/release/qusb$ext" "out/${{ matrix.out }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and stick zip
        run: |
          chmod +x dist/qusb-linux-* dist/qusb-macos-*
          # binaries only: this copy goes inside the zip as bin/SHA256SUMS
          (cd dist && sha256sum qusb-* > SHA256SUMS)
          mkdir -p stage/bin
          cp dist/qusb-* dist/SHA256SUMS stage/bin/
          cp stick/START-HERE.txt stage/
          (cd stage && zip -r ../dist/qusb-stick.zip bin START-HERE.txt)
          # the published SHA256SUMS also covers the zip
          (cd dist && sha256sum qusb-stick.zip >> SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/qusb-*
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/qusb-*
            dist/SHA256SUMS
