name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  out: qusb-linux-x64,        cross: false, musl: true }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, out: qusb-linux-arm64,      cross: true }
          - { os: macos-13,       target: x86_64-apple-darwin,        out: qusb-macos-x64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,       out: qusb-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     out: qusb-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --locked -p qusb-cli --bin qusb --target ${{ matrix.target }}
      - name: Build
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked -p qusb-cli --bin qusb --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: |
          mkdir out
          ext=""; case "${{ matrix.target }}" in *windows*) ext=".exe";; esac
          cp "target/${{ matrix.target }}/release/qusb$ext" "out/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and stick zip
        run: |
          chmod +x dist/qusb-linux-* dist/qusb-macos-*
          cd dist
          sha256sum qusb-* > SHA256SUMS
          cd ..
          mkdir -p stage/bin
          cp dist/qusb-* dist/SHA256SUMS stage/bin/
          cp stick/START-HERE.txt stage/
          (cd stage && zip -r ../dist/qusb-stick.zip bin START-HERE.txt)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/qusb-*
            dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qusb-*
            dist/SHA256SUMS
