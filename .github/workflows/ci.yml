name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  AGAVE_VERSION: v4.0.2 # pinned stable; bump deliberately

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --exclude qvault -- -D warnings
      - run: cargo test --workspace --exclude qvault

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Agave toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/${AGAVE_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo-build-sbf --manifest-path programs/qvault/Cargo.toml
      - run: cargo test -p qvault
