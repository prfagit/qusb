[workspace]
resolver = "2"
members = ["crates/qusb-wots", "crates/qusb-core", "crates/qusb-cli", "programs/qvault"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/prfagit/qusb"
authors = ["prfa"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
